
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Stopwatch</title>
    <link rel="stylesheet" href="Stopwatch.css">
    <style>
        /* Add these styles to your existing CSS file */
        .lap-list { margin-top: 20px; max-height: 200px; overflow-y: auto; list-style: none; padding: 0; }
        .lap-item { background: #222; padding: 8px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; }
        .hint { font-size: 0.8rem; color: #888; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>00:00:00</h1>
        <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="lapBtn">Lap</button>
            <button id="resetBtn">Reset</button>
        </div>
        <p class="hint">Shortcuts: Space = Start/Pause | L = Lap | R = Reset</p>
        <ul id="lapList" class="lap-list"></ul>
    </div>
    <script src="Stopwatch.js"></script>
</body>
</html>
